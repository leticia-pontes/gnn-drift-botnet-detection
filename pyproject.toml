description = "TCC: Resiliência de GNNs a mudanças de distribuição na detecção de botnets em IoT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Letícia Alves de Pontes" }
]

dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0",
    "torch-geometric>=2.4.0",
    "kaggle>=1.5.0",
]
